<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VetReach</title>
  <meta name="description" content="VetReach helps LGU veterinary offices plan and coordinate veterinary outreach to barangays.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var t = localStorage.getItem('vetreach-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite (Lucide-style strokes, 24×24) -->

      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-package" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 2h6v4H9z"/><path d="m9 14 2 2 4-4"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 5h13v11H2z"/><path d="M15 9h4l3 3v4h-7"/><circle cx="6.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>

      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
      <!-- Animal categories -->
      <symbol id="i-paw" viewBox="0 0 24 24"><circle cx="5.5" cy="10.5" r="2"/><circle cx="9.5" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18.5" cy="10.5" r="2"/><path d="M12 11c-2.8 0-5.5 3.8-5.5 6.3 0 1.9 1.6 2.6 3 2 1-.4 1.6-.7 2.5-.7s1.5.3 2.5.7c1.4.6 3-.1 3-2C17.5 14.8 14.8 11 12 11z"/></symbol>

      <symbol id="i-hen" viewBox="0 0 24 24"><path d="M14 4.5c0-1.2 1-2 2-2s2 .8 2 2"/><path d="M18 6.5 20.5 8 18 9"/><path d="M18 6.5c0 3-1 4 0 6.5 1 3.5-2 7-6.5 7S4 17 4 13l3 1c-.5-4 2-6.5 5-6 1-.5 1.5-2 2-3.5a2.6 2.6 0 0 1 4 2z"/><path d="M10 20v2M13 20v2"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="VetReach home">
        <img src="assets/logo.svg" alt="" width="34" height="34">
        <span class="brand-text">VetReach</span>
      </a>
      <nav class="side-nav" id="side-nav" aria-label="Main"></nav>
      <div class="side-foot">
        <button class="side-btn" type="button" data-action="start-tour" title="Tutorial">
          <svg class="ic" aria-hidden="true"><use href="#i-help"/></svg><span>Tutorial</span>
        </button>
        <button class="side-btn theme-btn" type="button" data-action="toggle-theme"></button>
        <button class="side-btn" type="button" data-action="reset-demo" title="Reset demo data">
          <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span>Reset demo</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="brand" href="#/overview" aria-label="VetReach home">
          <img src="assets/logo.svg" alt="" width="30" height="30">
          <span class="brand-text">VetReach</span>
        </a>
        <div class="appbar-actions">
          <button class="icon-btn round" type="button" data-action="start-tour" aria-label="Open the tutorial"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg></button>
          <button class="theme-btn icon-btn round" type="button" data-action="toggle-theme"></button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>

  <dialog id="modal" aria-labelledby="dlg-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="tour" class="tour" hidden></div>

  <script src="app.js"></script>
</body>
</html>
